// Capacitor modules - bundled for standalone builds
include ':capacitor-android'
project(':capacitor-android').projectDir = new File('./capacitor-modules/capacitor-android')

include ':capacitor-app'
project(':capacitor-app').projectDir = new File('./capacitor-modules/capacitor-app')

include ':capacitor-haptics'
project(':capacitor-haptics').projectDir = new File('./capacitor-modules/capacitor-haptics')

include ':capacitor-splash-screen'
project(':capacitor-splash-screen').projectDir = new File('./capacitor-modules/capacitor-splash-screen')

include ':capacitor-status-bar'
project(':capacitor-status-bar').projectDir = new File('./capacitor-modules/capacitor-status-bar')
